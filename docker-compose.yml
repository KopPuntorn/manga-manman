services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mangamanman
      POSTGRES_PASSWORD: mangamanman
      POSTGRES_DB: mangamanman
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangamanman"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://mangamanman:mangamanman@postgres:5432/mangamanman?sslmode=disable
      GROQ_API_KEY: ${GROQ_API_KEY}
      MANGA_TRANSLATOR: groq
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  pgdata:
